[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonbrx-devorar"
version = "0.3.0"
description = "Auditable parameter assimilation, frontier weight mapping, and causal probing"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "safetensors>=0.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
